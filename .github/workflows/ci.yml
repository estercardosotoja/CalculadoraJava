name: CI - Calculadora Java Swing

on:
  push:
    branches:
      - main
      - master
      - develop

  pull_request:
    branches:
      - main
      - master
      - develop

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:

      # Baixa o código do repositório
      - name: Checkout do código
        uses: actions/checkout@v5

      # Configura o Java 26
      - name: Configurar Java 26
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: maven

      # Verifica a versão instalada
      - name: Verificar versão do Java
        run: |
          java -version
          javac -version

      # Compila o projeto
      - name: Compilar projeto
        run: mvn clean compile

      # Executa os testes unitários
      - name: Executar testes unitários
        run: mvn test

      # Gera o JAR
      - name: Gerar aplicação
        run: mvn package -DskipTests

      # Disponibiliza o JAR como artefato
      - name: Upload do JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: calculadora-java
          path: target/*.jar